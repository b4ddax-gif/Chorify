name: Build CHORIFY APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CHORIFY
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Find Android project
        run: |
          echo "Searching for Gradle project..."
          find . -maxdepth 5 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print

      - name: Build CHORIFY APK
        run: |
          PROJECT_DIR=$(dirname "$(find . -name 'settings.gradle*' -type f | head -1)")

          if [ "$PROJECT_DIR" = "." ]; then
            gradle assembleDebug --stacktrace
          else
            cd "$PROJECT_DIR"
            gradle assembleDebug --stacktrace
          fi

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find . -type f -name "*.apk" -print

      - name: Upload CHORIFY APK
        uses: actions/upload-artifact@v4
        with:
          name: CHORIFY-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
