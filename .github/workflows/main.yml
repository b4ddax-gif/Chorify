name: Build CHORIFY APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CHORIFY
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract CHORIFY project
        shell: bash
        run: |
          set -e

          echo "Repository files:"
          find . -maxdepth 2 -type f | sort

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: CHORIFY ZIP file not found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p chorify_project
          unzip -q "$ZIP_FILE" -d chorify_project

          echo "Extracted files:"
          find chorify_project -maxdepth 3 -type f | sort

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find chorify_project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Generate Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew

      - name: Build CHORIFY APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "Generated APK:"
          find "${PROJECT_DIR}" -type f -name "*.apk" -print

      - name: Upload CHORIFY APK
        uses: actions/upload-artifact@v4
        with:
          name: CHORIFY-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
