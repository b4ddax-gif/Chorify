name: Build CHORIFY APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CHORIFY
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Find CHORIFY project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -1)

          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP: $ZIP_FILE"

            rm -rf chorify_project
            mkdir -p chorify_project

            unzip -q "$ZIP_FILE" -d chorify_project

            SETTINGS=$(find chorify_project -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              | head -1)

            if [ -z "$SETTINGS" ]; then
              echo "ERROR: Gradle settings file not found."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS")
          else
            SETTINGS=$(find . -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              | head -1)

            if [ -z "$SETTINGS" ]; then
              echo "ERROR: Gradle project not found."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS")
          fi

          echo "CHORIFY project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Disable unnecessary KSP and Room
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path("build.gradle.kts")

          if root.exists():
              s = root.read_text()
              s = s.replace(
                  '  alias(libs.plugins.google.devtools.ksp) apply false\n',
                  ''
              )
              root.write_text(s)

          app = Path("app/build.gradle.kts")

          if app.exists():
              s = app.read_text()

              s = s.replace(
                  '  alias(libs.plugins.google.devtools.ksp)\n',
                  ''
              )

              s = s.replace(
                  '  implementation(libs.androidx.room.ktx)\n',
                  ''
              )

              s = s.replace(
                  '  implementation(libs.androidx.room.runtime)\n',
                  ''
              )

              s = s.replace(
                  '  "ksp"(libs.androidx.room.compiler)\n',
                  ''
              )

              app.write_text(s)

          print("KSP/Room configuration cleaned.")
          PY

      - name: Create debug keystore
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          rm -f debug.keystore

          "$JAVA_HOME/bin/keytool" \
            -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "debug.keystore created successfully."

      - name: Generate Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew

      - name: Build CHORIFY APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew clean assembleDebug --stacktrace

      - name: Find APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Generated APK:"
          find . -type f -name "*.apk" -print

      - name: Upload CHORIFY APK
        uses: actions/upload-artifact@v4
        with:
          name: CHORIFY-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
